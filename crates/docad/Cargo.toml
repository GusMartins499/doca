[package]
name = "docad"
version.workspace = true
edition.workspace = true

[[bin]]
name = "docad"
path = "src/main.rs"

[dependencies]
doca-ipc.workspace = true
zbus.workspace = true
serde.workspace = true
tokio.workspace = true
anyhow.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true
x11rb = { version = "0.13", features = ["xtest"] }
async-channel = "2"
toml = "0.8"
toml_edit = "0.25"
# The config file is watched from a thread of its own, like the X11 root, so
# the blocking API is all that is needed — the default `stream` feature would
# pull in a second way of talking to tokio for nothing.
inotify = { version = "0.11", default-features = false }

[dev-dependencies]
futures-lite = "2"
# A paused clock, so the debounce is tested without waiting on a real one.
tokio = { workspace = true, features = ["test-util"] }
