[package]
name = "docad"
version.workspace = true
edition.workspace = true

[[bin]]
name = "docad"
path = "src/main.rs"

[dependencies]
doca-ipc.workspace = true
zbus.workspace = true
serde.workspace = true
tokio.workspace = true
anyhow.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true
x11rb = { version = "0.13", features = ["xtest"] }
async-channel = "2"
toml = "0.8"
toml_edit = "0.25"
# Remote album covers. Blocking and small, which is what the widget side of
# the daemon is: plain threads, no runtime. rustls rather than native-tls so
# the daemon does not start linking OpenSSL for one JPEG per track; no gzip,
# because nobody compresses a JPEG twice.
ureq = { version = "3", default-features = false, features = ["rustls"] }

[dev-dependencies]
futures-lite = "2"
